# Production environment overrides (only differences from application.yml)
milvus:
  uri: ${MILVUS_URI}

management:
  endpoint:
    health:
      show-details: when_authorized

security:
  api-key:
    enabled: true
    key: ${API_KEY:wokrag-default-key-change-me}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
